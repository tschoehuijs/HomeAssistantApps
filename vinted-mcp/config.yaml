name: "Vinted MCP Server"
description: "Home Assistant wrapper for Vinted MCP, providing marketplace search and analysis tools for AI assistants."
version: "0.1.2"
slug: "vinted_mcp"
url: "https://github.com/tschoehuijs/HomeAssistantApps"
arch:
  - aarch64
startup: application
boot: auto
init: false
ports:
  3001/tcp: 3002
ports_description:
  3001/tcp: "MCP Streamable HTTP endpoint"
options:
  auth_mode: http
  auth_cookies: ""
  auth_csrf_token: ""
schema:
  auth_mode: list(http|env)
  auth_cookies: password?
  auth_csrf_token: password?
icon: "icon.png"
logo: "logo.png"
timezone: true
