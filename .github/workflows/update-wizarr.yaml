name: Update Wizarr Version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch latest Wizarr release
        id: fetch_release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(curl -fsSL https://api.github.com/repos/wizarrrr/wizarr/releases/latest)"
          LATEST="$(echo "$RELEASE_JSON" | jq -r .tag_name | sed 's/^v//')"
          BODY="$(echo "$RELEASE_JSON" | jq -r .body)"

          echo "LATEST_VERSION=$LATEST" >> "$GITHUB_ENV"

          {
            echo "# Changelog"
            echo
            echo "## $LATEST"
            echo
            echo "$BODY"
            echo
          } > wizarr/CHANGELOG.md

          {
            echo "Wizarr upstream release: $LATEST"
            echo
            echo "$BODY"
          } > wizarr/RELEASE_NOTES.md

      - name: Update config.yaml
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^version: .*/version: \"${{ env.LATEST_VERSION }}\"/" wizarr/config.yaml

      - name: Commit and push if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add wizarr/config.yaml wizarr/CHANGELOG.md

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
