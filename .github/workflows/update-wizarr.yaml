name: Update Wizarr Version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest Wizarr release
        id: fetch_release
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/wizarrrr/wizarr/releases/latest)

          LATEST=$(echo "$RELEASE_JSON" | jq -r .tag_name | sed 's/^v//')
          BODY=$(echo "$RELEASE_JSON" | jq -r .body)

          echo "LATEST_VERSION=$LATEST" >> "$GITHUB_ENV"

          {
            echo "# Changelog"
            echo
            echo "## $LATEST"
            echo
            echo "$BODY"
            echo
          } > wizarr/CHANGELOG.md

          {
            echo "Wizarr upstream release: $LATEST"
            echo
            echo "$BODY"
          } > wizarr/RELEASE_NOTES.md

      - name: Update config.yaml
        run: |
          sed -i "s/^version: .*/version: \"${{ env.LATEST_VERSION }}\"/" wizarr/config.yaml

      - name: Commit and push if changed
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add wizarr/config.yaml wizarr/CHANGELOG.md

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            git commit -m "Bump Wizarr to ${{ env.LATEST_VERSION }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="wizarr-v${{ env.LATEST_VERSION }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
          else
            gh release create "$TAG" \
              --title "Wizarr ${{ env.LATEST_VERSION }}" \
              --notes-file wizarr/RELEASE_NOTES.md \
              --target main
          fi
``
