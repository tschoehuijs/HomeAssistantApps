name: Update Tracearr Version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch latest Tracearr release
        id: fetch_release
        run: |
          set -eo pipefail
          
          # Added -f to curl so it fails immediately if rate-limited (HTTP 403)
          RELEASE_JSON=$(curl -sSf https://api.github.com/repos/connorgallopo/tracearr/releases/latest)
          
          LATEST=$(echo "$RELEASE_JSON" | jq -r .tag_name | sed 's/^v//')
          BODY=$(echo "$RELEASE_JSON" | jq -r .body)
          
          # Failsafe: stop if the version evaluates to empty or null
          if [ -z "$LATEST" ] || [ "$LATEST" == "null" ]; then
            echo "Failed to get a valid version tag. Exiting."
            exit 1
          fi
          
          echo "LATEST_VERSION=$LATEST" >> "$GITHUB_ENV"
          
          {
            echo "# Changelog"
            echo
            echo "## $LATEST"
            echo
            echo "$BODY"
            echo
          } > tracearr/CHANGELOG.md
          
          {
            echo "Tracearr upstream release: $LATEST"
            echo
            echo "$BODY"
          } > tracearr/RELEASE_NOTES.md

      - name: Update config.yaml
        run: |
          sed -i "s/^version: .*/version: \"${{ env.LATEST_VERSION }}\"/" tracearr/config.yaml

      - name: Commit and push if changed
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add tracearr/config.yaml tracearr/CHANGELOG.md

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            git commit -m "Bump Tracearr to ${{ env.LATEST_VERSION }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tracearr-v${{ env.LATEST_VERSION }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
          else
            gh release create "$TAG" \
              --title "Tracearr ${{ env.LATEST_VERSION }}" \
              --notes-file tracearr/RELEASE_NOTES.md \
              --target main
          fi
