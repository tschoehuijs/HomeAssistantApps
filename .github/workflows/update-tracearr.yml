name: Update Tracearr Version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest Tracearr version
        id: fetch_version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/connorgallopo/tracearr/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "LATEST_VERSION=$LATEST" >> $GITHUB_ENV

      - name: Update config.yaml
        run: |
          sed -i "s/^version: .*/version: \"${{ env.LATEST_VERSION }}\"/" tracearr/config.yaml

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracearr/config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Bump Tracearr to ${{ env.LATEST_VERSION }}" && git push)
