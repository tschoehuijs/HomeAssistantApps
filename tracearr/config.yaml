name: "Tracearr"
description: "Home Assistant wrap of Tracearr, which provides real-time monitoring for Plex, Jellyfin, and Emby."
version: "2.2.3"
slug: "tracearr"
url: "https://github.com/tschoehuijs/HomeAssistantApps"
arch:
  - aarch64
  - amd64
ports:
  3000/tcp: 3000
map:  - data:rw
  - media:rw
  - share:rw
options:
  PG_MAX_MEMORY: "512MB"
  TZ: "Europe/Amsterdam"
schema:
  PG_MAX_MEMORY: str
  TZ: str
options: {}
icon: "icon.png"
logo: "logo.png"
webui: "http://[HOST]:[PORT:3000]/"
