name: "MCP Auth Gateway"
description: "OAuth authentication gateway for an existing HTTP MCP server."
version: "2.10.2"
slug: "mcp_auth_gateway"
url: "https://github.com/sigbit/mcp-auth-proxy"
arch:
  - aarch64
startup: application
boot: manual
init: true
ports:
  8080/tcp: 9877
ports_description:
  8080/tcp: "OAuth gateway HTTP endpoint; place behind HTTPS reverse proxy"
watchdog: "http://[HOST]:[PORT:8080]/healthz"
options:
  external_url: ""
  backend_url: "http://[HOST]:9876"
  password: ""
schema:
  external_url: url
  backend_url: url
  password: password
